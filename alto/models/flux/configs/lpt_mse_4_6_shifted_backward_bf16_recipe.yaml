training_stage:
  lpt_modifiers:
    LowPrecisionTrainingModifier:
      scheme: "mxfp4"
      targets: ["Linear"]
      ignore:
        - "re:^img_in\\."
        - "re:^txt_in\\."
        - "re:^time_in\\."
        - "re:^vector_in\\."
        - "re:.*_mod\\.lin"
        - "re:.*modulation\\.lin"
        - "re:.*final_layer.*"
      use_2dblock_x: false
      use_2dblock_w: true
      use_hadamard: false
      use_sr_grad: false
      use_dge: false
      clip_mode: none
      two_level_scaling: tensorwise
      mxfp4_scale_selection: mse_4_6_shifted
      forward_precision: low
      backward_precision: bf16
      deosc_step: 2000
      deosc_period: 200
      deosc_ratio: 4.0
      deosc_log_freq: 1
