training_stage:
  lpt_modifiers:
    LowPrecisionTrainingModifier:
      scheme: "mxfp4"

      targets: ["Linear"]
      ignore:
        # These layers operate on per-sample vectors. With small local batches,
        # MXFP4 activation quantization along axis 0 is not block-size aligned.
        - "re:^img_in\\."
        - "re:^txt_in\\."
        - "re:^time_in\\."
        - "re:^vector_in\\."
        - "re:.*_mod\\.lin"
        - "re:.*modulation\\.lin"
        - "re:.*final_layer.*"
      use_2dblock_x: false
      use_2dblock_w: true
      use_hadamard: false
      use_sr_grad: false
      use_dge: false
      clip_mode: none
      two_level_scaling: tensorwise
      mxfp4_scale_selection: mse_4_6_shifted
      # Directional ablation: both defaults preserve the low-precision baseline.
      # Set either field to bf16 to bypass QDQ only for that direction.
      forward_precision: bf16
      backward_precision: low
      # Weight de-oscillation is disabled by default. Uncomment to enable it
      # after the configured step.
      # deosc_step: 2000
      # deosc_period: 200
      # deosc_ratio: 4.0
      # deosc_log_freq: 1
      # deosc_targets:
      #   - "re:double_blocks\\..*_attn\\.(qkv|proj)\\.weight$"

      precision_schedule:
        # Step ranges are [start_step, end_step). Training steps start from 1.
        # Edit these boundaries to control low-precision warmup/cooldown phases.
        # - precision: bf16
        #   start_step: 1
        #   end_step: 20000
        - precision: mxfp4
          start_step: 1
          end_step: 33000
        - precision: bf16
          start_step: 33001


