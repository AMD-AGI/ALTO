training_stage:
  lpt_modifiers:
    LowPrecisionTrainingModifier:
      scheme: "mxfp4"
      targets: ["Linear"]
      # Per-sample layers (time, CLIP, modulation, adaLN) quantize along the
      # batch axis. The debug config uses microbatch 32, matching the MXFP4
      # group and the Hadamard block.
      ignore: []
      use_2dblock_x: false
      use_2dblock_w: true
      use_hadamard: true
      use_sr_grad: true
      use_uos: true
      use_dge: false
      clip_mode: none
      two_level_scaling: none
