training_stage:
  lpt_modifiers:
    LowPrecisionTrainingModifier:
      scheme: "mxfp4"
      targets: ["Linear"]
      # Input projections, the CLIP vector embedding, the final projection,
      # and adaLN modulation stay in the transformer dtype.
      ignore:
        - img_in
        - txt_in
        - "re:time_in.*$"
        - "re:vector_in.*$"
        - "re:final_layer.*$"
        - "re:.*\\.img_mod\\.lin$"
        - "re:.*\\.txt_mod\\.lin$"
        - "re:.*\\.modulation\\.lin$"
      use_2dblock_x: false
      use_2dblock_w: true
      use_hadamard: true
      use_fwd_hadamard: true
      use_dx_hadamard: true
      use_sr_grad: true
      use_uos: true
      use_dge: false
      clip_mode: none
      two_level_scaling: none
