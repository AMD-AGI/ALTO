training_stage:
  lpt_modifiers:
    LowPrecisionTrainingModifier:
      scheme: "mxfp4_adahop"
      targets: ["Linear"]
      # Exclude the MoE router gate: quantizing it leaves top_scores in a dtype
      # that mismatches routed_output at the bmm in moe.py (RuntimeError: expected
      # BFloat16 but found Float). The nolora recipe already excludes it. AdaHOP
      # only transforms LPT-wrapped Linears, so this exclusion also keeps the gate
      # out of the AdaHOP pass — no separate ignore needed there.
      ignore: ["output", "re:.*\\.router\\.gate"]
      use_2dblock_x: false
      use_2dblock_w: true
      use_hadamard: true
      use_sr_grad: true
      use_dge: false
      clip_mode: none
      two_level_scaling: none
    AdaHOPModifier:
      enabled: true
      use_hadamard: true
      # Randomized Hadamard (random sign/permutation) to match the plain-MXFP4
      # baseline, which keeps HadamardFactory's randomized=True default. A fixed
      # (deterministic) Hadamard decorrelates outliers less well; the small
      # per-step difference compounds over training into a widening val-loss gap
      # vs plain MXFP4 (S5). See plan keen-questing-ember.
      use_randomized_hadamard: true
      calibration_steps: 30
      layer_transform_config:
        "row-row": "hadamard"
        "row-none": "inner_outlier_extract_left"
        "row-col": "inner_outlier_extract_right"
        "col-row": "hadamard"
        "col-none": "hadamard"
        "col-col": "full_precision"
        "none-row": "hadamard"
        "none-none": "hadamard"
        "none-col": "inner_outlier_extract_right"
  moe_lpt_modifiers:
    LowPrecisionTrainingModifier:
      scheme: "mxfp4"
      targets: ["GptOssGroupedExperts"]
      ignore: ["output", "re:.*\\.router\\.gate"]
      use_2dblock_x: false
      use_2dblock_w: true
      use_hadamard: true
      use_sr_grad: true
      use_dge: false
      clip_mode: none
      two_level_scaling: none 