training_stage:
  lpt_modifiers:
    LowPrecisionTrainingModifier:
      scheme:
        # 20b_megatron experts have no bias, so they are plain GroupedLinear.
        # MRO match: FlexInnerAttention also covers SlidingWindowFlexInnerAttention.
        mxfp8_e4m3: ["Linear", "GroupedLinear", "FlexInnerAttention"]
      ignore: ["lm_head", "re:.*\\.router\\.gate"]
      use_2dblock_x: false
      use_2dblock_w: true
      # The MXFP8 GEMMs do not read use_hadamard.
      use_hadamard: true
      use_sr_grad: true
      use_dge: false
      clip_mode: none
      two_level_scaling: none
      attention_consistent_delta: true
