training_stage:
  lpt_modifiers:
    LowPrecisionTrainingModifier:
      scheme: "mxfp4"
      targets: ["Linear"]
      ignore: ["output"]
      use_2dblock_x: false
      use_2dblock_w: true
      # This mirrors lpt_hadamard_recipe.yaml, plus full_precision_backward.
      # full_precision_backward keeps the backward (dgrad + wgrad) in bf16 with the
      # gradient unquantized — only the forward is MXFP4. use_hadamard / use_sr_grad
      # act ONLY on the (now-skipped) quantized backward in this codebase, so they
      # are inert here; left true to show this is the hadamard recipe with the
      # backward ignored.
      full_precision_backward: true
      use_hadamard: true
      use_sr_grad: true
      use_dge: false
      clip_mode: none
      two_level_scaling: none
      lora_rank: 0
